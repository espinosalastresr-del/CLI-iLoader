name: Build (Alpine/musl - iSH i686)

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-musl-i686-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-i686-

      # NOTA: iSH corre sobre un kernel Linux 4.20.69-ish, arch i686, APK arch x86,
      # sobre Alpine 3.14.3. El binario DEBE ser i686, no x86_64.
      - name: Instalar Rust + target i686-musl
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-musl

      - name: Instalar cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Compilar para i686-musl
        id: build
        run: cross build --release --target i686-unknown-linux-musl
        continue-on-error: true

      # Si falla, imprime el código fuente real de idevice ya descargado
      # en el runner, para no seguir adivinando nombres de métodos.
      - name: Dump fuente idevice (solo si falló la build)
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== provider.rs ====="
          find ~/.cargo/registry/src -path '*idevice-0.1.65/src/provider.rs' -exec cat {} \;
          echo "===== remote_pairing (todo el módulo) ====="
          find ~/.cargo/registry/src -path '*idevice-0.1.65/src/remote_pairing*' -exec sh -c 'echo "--- {} ---"; cat {}' \;
          echo "===== rsd.rs ====="
          find ~/.cargo/registry/src -path '*idevice-0.1.65/src/rsd.rs' -exec cat {} \;

      - name: Fallar el job si la build falló
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Preparar binario
        run: |
          mkdir -p dist
          cp target/i686-unknown-linux-musl/release/iloader dist/iloader-linux-i686
          chmod +x dist/iloader-linux-i686

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: iloader-linux-i686
          path: dist/iloader-linux-i686
          retention-days: 14
