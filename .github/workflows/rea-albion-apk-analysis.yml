name: REA Albion Android APK Analysis

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "HTTPS URL of an authorized APK (Albion Online URL prefilled)"
        required: true
        type: string
        default: "https://live.albiononline.com/clients/20261015105018/Albion-Online.apk"

permissions:
  contents: read

jobs:
  analyze-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REA_VERSION: "6.7.0"
      REA_JADX_SHA256: "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5 # v4.3.1
        with:
          dotnet-version: "6.0.x"

      - name: Install Java and archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openjdk-21-jdk-headless unzip file binutils apktool p7zip-full
          java --version
          dotnet --info

      - name: Prepare isolated workspace
        id: dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/albion-apk" "$RUNNER_TEMP/rea-android" "$RUNNER_TEMP/rea-reports" "$RUNNER_TEMP/rea-tools"
          echo "reports=$RUNNER_TEMP/rea-reports" >> "$GITHUB_OUTPUT"

      - name: Validate URL and download APK
        id: download
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          python3 - "$APK_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          u = urlparse(sys.argv[1])
          if u.scheme != "https" or u.hostname != "live.albiononline.com" or not u.path.endswith(".apk"):
              raise SystemExit("Refusing URL: expected HTTPS on live.albiononline.com ending in .apk")
          PY
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 "$APK_URL" \
            --output "$RUNNER_TEMP/albion-apk/Albion-Online.apk"
          test -s "$RUNNER_TEMP/albion-apk/Albion-Online.apk"
          file "$RUNNER_TEMP/albion-apk/Albion-Online.apk" | tee "$RUNNER_TEMP/rea-reports/apk-file-type.txt"
          sha256sum "$RUNNER_TEMP/albion-apk/Albion-Online.apk" | tee "$RUNNER_TEMP/rea-reports/apk-sha256.txt"
          stat --printf='bytes=%s\n' "$RUNNER_TEMP/albion-apk/Albion-Online.apk" | tee "$RUNNER_TEMP/rea-reports/apk-size.txt"
          python3 - "$RUNNER_TEMP/albion-apk/Albion-Online.apk" "$RUNNER_TEMP/rea-reports/apk-zip-integrity.txt" <<'PY'
          import sys, zipfile
          p, out = sys.argv[1:]
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = z.namelist()
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("Archive has no root AndroidManifest.xml; not a standalone APK")
              with open(out, "w", encoding="utf-8") as f:
                  f.write(f"ZIP CRC checks passed; {len(names)} entries; AndroidManifest.xml present.\n")
          PY

      - name: Install pinned REA CLI and JADX engine
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea-tool" --no-audit --no-fund --save-exact "rea-agents@${REA_VERSION}"
          echo "$RUNNER_TEMP/rea-tool/node_modules/.bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar" \
            --output "$RUNNER_TEMP/rea-android/jadx-headless-mcp-0.7.1-all.jar"
          echo "${REA_JADX_SHA256}  $RUNNER_TEMP/rea-android/jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check -
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea-android/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Inspect Android package with REA
        id: inspect
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rea inspect-android-package "$RUNNER_TEMP/albion-apk/Albion-Online.apk" \
            > "$RUNNER_TEMP/rea-reports/rea-android-package.json" \
            2> "$RUNNER_TEMP/rea-reports/rea-android-package.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/rea-reports/rea-android-package.exit-code.txt"
          set -e
          exit "$status"

      - name: Decode Android manifest and resources with Apktool
        if: ${{ always() && steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 15m apktool d --force --no-src "$RUNNER_TEMP/albion-apk/Albion-Online.apk" -o "$RUNNER_TEMP/rea-reports/apktool-decoded" > "$RUNNER_TEMP/rea-reports/apktool.stdout.txt" 2> "$RUNNER_TEMP/rea-reports/apktool.stderr.txt"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/rea-reports/apktool.exit-code.txt"
          if [ -f "$RUNNER_TEMP/rea-reports/apktool-decoded/AndroidManifest.xml" ]; then cp "$RUNNER_TEMP/rea-reports/apktool-decoded/AndroidManifest.xml" "$RUNNER_TEMP/rea-reports/AndroidManifest-decoded.xml"; fi
          exit "$status"

      - name: Comprehensive APK inventory and static string analysis
        id: static_analysis
        continue-on-error: true
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/analyze_apk_static.py "$RUNNER_TEMP/albion-apk/Albion-Online.apk" "$RUNNER_TEMP/rea-reports"
          # Hash the report files for reproducibility; do not hash or upload the APK itself here.
          find "$RUNNER_TEMP/rea-reports" -maxdepth 1 -type f ! -name "report-sha256-manifest.txt" -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/rea-reports/report-sha256-manifest.txt"

      - name: Extract IL2CPP metadata and collect readable strings
        id: il2cpp
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/albion-apk/Albion-Online.apk" "$RUNNER_TEMP/rea-reports" <<'PY'
          import pathlib, re, sys, zipfile
          apk, report = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          wanted = "assets/bin/Data/Managed/Metadata/global-metadata.dat"
          metadata = report / "global-metadata.dat"
          with zipfile.ZipFile(apk) as z:
              matches = [i for i in z.infolist() if i.filename == wanted]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {wanted}; found {len(matches)}")
              info = matches[0]
              if info.file_size > 512 * 1024 * 1024:
                  raise SystemExit("IL2CPP metadata exceeds 512 MiB safety limit")
              with z.open(info) as src, metadata.open("wb") as dst:
                  while True:
                      block = src.read(1024 * 1024)
                      if not block:
                          break
                      dst.write(block)
          data = metadata.read_bytes()
          if len(data) < 8:
              raise SystemExit("IL2CPP metadata is empty or too small")
          (report / "il2cpp-metadata-header.txt").write_text(
              f"file={wanted}\nbytes={len(data)}\nmagic_le=0x{int.from_bytes(data[:4], 'little'):08x}\nversion_le={int.from_bytes(data[4:8], 'little')}\n",
              encoding="utf-8")
          # Static triage only: harvest printable ASCII and UTF-16LE strings.
          # This is not a full IL2CPP metadata parser and does not recover method bodies.
          strings = []
          for m in re.finditer(rb"[\x20-\x7e]{4,}", data):
              strings.append(m.group().decode("ascii", "replace"))
          for m in re.finditer(rb"(?:[\x20-\x7e]\x00){4,}", data):
              strings.append(m.group().decode("utf-16le", "replace"))
          strings = list(dict.fromkeys(strings))
          (report / "il2cpp-metadata-strings.txt").write_text("\n".join(strings) + ("\n" if strings else ""), encoding="utf-8")
          pattern = re.compile(r"fish(?:ing)?|rod|bait|catch|gather|inventory|market|silver|loot|resource|network|socket|http|login|account|guild|craft|trade|auction|item", re.I)
          hits = [s for s in strings if pattern.search(s)]
          (report / "il2cpp-keyword-hits.txt").write_text("\n".join(hits[:5000]) + ("\n" if hits else ""), encoding="utf-8")
          print(f"Extracted {len(strings)} unique printable strings; {len(hits)} keyword candidates.")
          PY

      - name: Search Android classes for gameplay-related names
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          apk="$RUNNER_TEMP/albion-apk/Albion-Online.apk"
          out="$RUNNER_TEMP/rea-reports"
          for term in fish fishing gather inventory item market silver resource loot; do
            rea search-android-classes "$apk" "$term" --json \
              > "$out/classes-search-$term.json" 2> "$out/classes-search-$term.stderr"
            printf '%s\n' "$?" > "$out/classes-search-$term.exit-code.txt"
          done
          set -e

      - name: Extract IL2CPP binaries and metadata
        if: ${{ always() && steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/albion-apk/Albion-Online.apk" "$RUNNER_TEMP/rea-tools/il2cpp" "$RUNNER_TEMP/rea-reports" <<'PY'
          import pathlib,sys,zipfile,json,re
          apk,dest,report=map(pathlib.Path,sys.argv[1:]); dest.mkdir(parents=True,exist_ok=True)
          targets={"assets/bin/Data/Managed/Metadata/global-metadata.dat":dest/"global-metadata.dat","lib/arm64-v8a/libil2cpp.so":dest/"libil2cpp-arm64.so","lib/arm64-v8a/libunity.so":dest/"libunity-arm64.so","lib/armeabi-v7a/libil2cpp.so":dest/"libil2cpp-armv7.so"}
          result={}
          with zipfile.ZipFile(apk) as z:
            for name,out in targets.items():
              try: info=z.getinfo(name)
              except KeyError: result[name]={"found":False}; continue
              if info.file_size>600*1024*1024: result[name]={"found":True,"error":"safety limit","size":info.file_size}; continue
              with z.open(info) as src,out.open("wb") as dst:
                while True:
                  b=src.read(1024*1024)
                  if not b: break
                  dst.write(b)
              result[name]={"found":True,"size":info.file_size}
          (report/"il2cpp-extraction.json").write_text(json.dumps(result,indent=2),encoding="utf-8")
          meta=targets["assets/bin/Data/Managed/Metadata/global-metadata.dat"]
          if meta.exists():
            data=meta.read_bytes()
            (report/"il2cpp-metadata-header.txt").write_text("bytes=%d\nmagic_le=0x%08x\nversion_le=%d\n"%(len(data),int.from_bytes(data[:4],"little"),int.from_bytes(data[4:8],"little")),encoding="utf-8")
            strings=[m.group().decode("ascii","replace") for m in re.finditer(rb"[\x20-\x7e]{4,}",data)]
            strings += [m.group().decode("utf-16le","replace") for m in re.finditer(rb"(?:[\x20-\x7e]\x00){4,}",data)]
            strings=list(dict.fromkeys(strings))
            (report/"il2cpp-metadata-strings.txt").write_text("\n".join(strings)+"\n",encoding="utf-8")
            pat=re.compile(r"fish|rod|bait|gather|inventory|market|silver|loot|resource|network|socket|http|login|guild|craft|trade|auction|item",re.I)
            (report/"il2cpp-keyword-hits.txt").write_text("\n".join(s for s in strings if pat.search(s))+"\n",encoding="utf-8")
          PY

      - name: Reconstruct managed assemblies with Cpp2IL
        if: ${{ always() && steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/rea-reports/cpp2il"
          curl --fail --location --silent --show-error --retry 3 "https://github.com/SamboyCoding/Cpp2IL/releases/download/2022.0.7/Cpp2IL-2022.0.7-Linux" -o "$RUNNER_TEMP/rea-tools/Cpp2IL"
          status=$?
          if [ "$status" -eq 0 ]; then
            chmod +x "$RUNNER_TEMP/rea-tools/Cpp2IL"
            timeout 30m "$RUNNER_TEMP/rea-tools/Cpp2IL" --game-path="$RUNNER_TEMP/albion-apk/Albion-Online.apk" --output-to="$RUNNER_TEMP/rea-reports/cpp2il" --verbose > "$RUNNER_TEMP/rea-reports/cpp2il.stdout.txt" 2> "$RUNNER_TEMP/rea-reports/cpp2il.stderr.txt"
            status=$?
          fi
          printf '%s\n' "$status" > "$RUNNER_TEMP/rea-reports/cpp2il.exit-code.txt"
          find "$RUNNER_TEMP/rea-reports/cpp2il" -type f -printf '%P\t%s bytes\n' | sort > "$RUNNER_TEMP/rea-reports/cpp2il-output-index.txt"
          exit "$status"

      - name: Reconstruct metadata with Il2CppDumper
        if: ${{ always() && steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/rea-tools/Il2CppDumper" "$RUNNER_TEMP/rea-reports/il2cppdumper"
          curl --fail --location --silent --show-error --retry 3 "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip" -o "$RUNNER_TEMP/rea-tools/Il2CppDumper.zip"
          status=$?
          if [ "$status" -eq 0 ]; then
            unzip -oq "$RUNNER_TEMP/rea-tools/Il2CppDumper.zip" -d "$RUNNER_TEMP/rea-tools/Il2CppDumper"
            exe="$(find "$RUNNER_TEMP/rea-tools/Il2CppDumper" -name Il2CppDumper.dll -print -quit)"
            bin="$RUNNER_TEMP/rea-tools/il2cpp/libil2cpp-arm64.so"; meta="$RUNNER_TEMP/rea-tools/il2cpp/global-metadata.dat"
            if [ -n "$exe" ] && [ -s "$bin" ] && [ -s "$meta" ]; then
              timeout 25m dotnet "$exe" "$bin" "$meta" "$RUNNER_TEMP/rea-reports/il2cppdumper" > "$RUNNER_TEMP/rea-reports/il2cppdumper.stdout.txt" 2> "$RUNNER_TEMP/rea-reports/il2cppdumper.stderr.txt"
              status=$?
            else
              echo "Il2CppDumper DLL, ARM64 libil2cpp or metadata missing" > "$RUNNER_TEMP/rea-reports/il2cppdumper.stderr.txt"; status=2
            fi
          fi
          printf '%s\n' "$status" > "$RUNNER_TEMP/rea-reports/il2cppdumper.exit-code.txt"
          find "$RUNNER_TEMP/rea-reports/il2cppdumper" -type f -printf '%P\t%s bytes\n' | sort > "$RUNNER_TEMP/rea-reports/il2cppdumper-output-index.txt"
          exit "$status"

      - name: Inspect native ELF libraries and extract strings
        if: ${{ always() && steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/rea-tools/il2cpp"; out="$RUNNER_TEMP/rea-reports/native"; mkdir -p "$out"
          for lib in "$base"/*.so; do
            [ -f "$lib" ] || continue
            name="$(basename "$lib")"
            readelf -h "$lib" > "$out/$name.elf-header.txt" 2>&1 || true
            readelf -d "$lib" > "$out/$name.dynamic.txt" 2>&1 || true
            readelf -Ws "$lib" > "$out/$name.symbols.txt" 2>&1 || true
            strings -a -n 5 "$lib" > "$out/$name.strings-ascii.txt" 2>&1 || true
            strings -a -el -n 4 "$lib" > "$out/$name.strings-utf16le.txt" 2>&1 || true
          done
          grep -Eai 'https?://|wss?://|api|socket|network|login|market|inventory|item|silver|resource|guild|craft|trade|fish|fishing' "$out"/*.strings-*.txt > "$RUNNER_TEMP/rea-reports/native-keyword-hits.txt" || true

      - name: Generate tool status report and report hashes
        if: ${{ always() && steps.download.outcome == 'success' }}
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/rea-reports" <<'PY'
          import pathlib,sys,json,hashlib
          root=pathlib.Path(sys.argv[1]); names=["rea-android-package.exit-code.txt","apktool.exit-code.txt","cpp2il.exit-code.txt","il2cppdumper.exit-code.txt"]
          rows=[]
          for name in names:
            p=root/name; rows.append({"stage":name.removesuffix(".exit-code.txt"),"status":p.read_text().strip() if p.exists() else "not-run"})
          data={"tools":rows,"coverage":["APK hashes/integrity and full inventory","Android manifest/resources decoding","Unity IL2CPP metadata and native binary extraction","Cpp2IL managed assembly reconstruction attempt","Il2CppDumper metadata/dummy DLL/Ghidra scripts attempt","ELF headers, dynamic sections, symbols and native strings"],"limitations":["Tools may not support this Unity metadata version or protections","Recovered output is not original source code","String indicators are leads, not proof of active endpoints","No APK execution or endpoint probing","Server-side game logic is not in the client APK"]}
          (root/"analysis-coverage.json").write_text(json.dumps(data,indent=2),encoding="utf-8")
          (root/"analysis-coverage.md").write_text("# Coverage report\n\n"+"\n".join("- "+r["stage"]+": "+r["status"] for r in rows)+"\n\n## Limitations\n"+"\n".join("- "+x for x in data["limitations"])+"\n",encoding="utf-8")
          lines=[]
          for p in sorted(root.rglob("*")):
            if p.is_file() and p.name!="report-sha256-manifest.txt":
              try: lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+str(p.relative_to(root)))
              except OSError as e: lines.append("ERROR "+str(p.relative_to(root))+": "+str(e))
          (root/"report-sha256-manifest.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Upload reports (not the original APK)
        if: ${{ always() && steps.dirs.outputs.reports != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-albion-android-analysis
          path: ${{ steps.dirs.outputs.reports }}/
          if-no-files-found: warn
          retention-days: 14
