[package]
name    = "iloader-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iloader"
path = "src/main.rs"

[dependencies.isideload]
git = "https://github.com/espinosalastresr-del/isideload.git"
branch = "main"
default-features = false
features = ["install", "fs-storage"]

[dependencies.idevice]
version = "0.1.61"
default-features = false
features = ["usbmuxd", "afc", "house_arrest", "installation_proxy", "pair", "core_device_proxy", "xpc", "ring", "tunnel_tcp_stack"]

[dependencies]
clap               = { version = "4.5", features = ["derive", "env"] }
tokio              = { version = "1", features = ["full"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
plist              = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror          = "2"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
